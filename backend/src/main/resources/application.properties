spring.application.name=backend

# Optional local developer configuration override (gitignored)
spring.config.import=optional:classpath:application-local.properties

# Database Configuration (Environment variable overrides with safe defaults)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cabbooking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:CabBookingApplicationDefaultSecretKeyForJwtAuthentication2026}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}